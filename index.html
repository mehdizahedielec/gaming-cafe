<!DOCTYPE html>
<html lang="fa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>کافی‌شاپ گیمینگ</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        .home-container {
            background-color: rgba(255, 255, 255, 0.9);
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 12px 24px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 800px;
            text-align: center;
        }
        
        .home-buttons {
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin-top: 30px;
        }
        
        .home-button {
            background-color: #007bff;
            color: white;
            padding: 15px 25px;
            border: none;
            border-radius: 8px;
            font-size: 1.2em;
            cursor: pointer;
            transition: background-color 0.3s, transform 0.2s;
            text-decoration: none;
        }
        
        .home-button:hover {
            background-color: #0056b3;
            transform: translateY(-3px);
        }
        
        .home-button.register {
            background-color: #28a745;
        }
        
        .home-button.register:hover {
            background-color: #218838;
        }
        
        .home-button.login {
            background-color: #17a2b8;
        }
        
        .home-button.login:hover {
            background-color: #138496;
        }
    </style>
</head>
<body>
    <div class="home-container">
        <h1>به کافی‌شاپ گیمینگ خوش آمدید</h1>
        <p>مکانی برای تفریح، بازی و لذت بردن از نوشیدنی‌های خوشمزه</p>
        
        <div class="home-buttons">
            <a href="register.html" class="home-button register">ثبت‌نام</a>
            <a href="login.html" class="home-button login">ورود</a>
            <a href="select_item.html" class="home-button">رزرو کنسول یا میز بیلیارد</a>
        </div>
    </div>
</body>
</html>
